name: Daily Review Digest

on:
  schedule:
    # 04:00 UTC = 11am Vietnam time (Asia/Ho_Chi_Minh is a fixed UTC+7, no DST)
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Fetch reviews and post to Zalo
        env:
          APIFY_URL: ${{ secrets.APIFY_URL }}
          ZALO_URL: ${{ secrets.ZALO_URL }}
          ZALO_CHAT_ID: ${{ secrets.ZALO_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node src/index.js

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/last-run.json
          git diff --staged --quiet || git commit -m "Update review state [skip ci]"
          git push
